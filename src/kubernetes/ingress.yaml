  kubectl apply -n cinemaabyss -f - <<EOF
  apiVersion: networking.k8s.io/v1
  kind: Ingress
  metadata:
    name: cinemaabyss-ingress
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /$2
      nginx.ingress.kubernetes.io/use-regex: "true"
  spec:
    ingressClassName: nginx
    rules:
      - host: cinemaabyss.example.com
        http:
          paths:
            - path: /api/movies(/|$)(.*)
              pathType: Prefix
              backend:
                service:
                  name: movies-service
                  port:
                    number: 8081
            - path: /api/users(/|$)(.*)
              pathType: Prefix
              backend:
                service:
                  name: monolith
                  port:
                    number: 8080
            - path: /api/events(/|$)(.*)
              pathType: Prefix
              backend:
                service:
                  name: events-service
                  port:
                    number: 8082