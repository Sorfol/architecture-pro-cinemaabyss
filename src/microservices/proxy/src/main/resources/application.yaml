server:
  port: 8000

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: monolith
              uri: ${MONOLITH_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
                - name: Weight
                  args:
                    group: movies-migration
                    weight: ${MOVIES_MIGRATION_PERCENT:50}
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: movies-service
              uri: ${MOVIES_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/movies/**
                - name: Weight
                  args:
                    group: movies-migration
                    weight: ${100 - ${MOVIES_MIGRATION_PERCENT:50}}
              filters:
                - RewritePath=/api/movies/(?<segment>.*), /$\{segment}

            - id: events-service
              uri: ${EVENTS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/events/**
              filters:
                - RewritePath=/api/events/(?<segment>.*), /$\{segment}