server:
  port: 8000

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: monolith
              uri: http://localhost:8080
              predicates:
                - Path=/api/**
                - name: Weight
                  args:
                    group: migration
                    weight: 50
              filters:
                - RewritePath=/api/(?<segment>.*), /$\{segment}

            - id: movies-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/movies/**
                - name: Weight
                  args:
                    group: migration
                    weight: 50
              filters:
                - RewritePath=/api/movies/(?<segment>.*), /$\{segment}

            - id: events-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/events/**
              filters:
                - RewritePath=/api/events/(?<segment>.*), /$\{segment}