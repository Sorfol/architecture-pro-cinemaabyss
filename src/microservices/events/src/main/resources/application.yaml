server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      acks: "1"
      properties:
        spring.json.add.type.headers: true
        spring.json.value.default.type: org.example.model.PaymentEvent
        spring.json.type.mapping: |
          movieEvent:org.example.model.MovieEvent,
          paymentEvent:org.example.model.PaymentEvent,
          userEvent:org.example.model.UserEvent
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.key.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: org.example.model.MovieEvent
        spring.json.trusted.packages: "org.example.model,*"
        spring.json.use.type.headers: true
        spring.json.type.mapping: |
          movieEvent:org.example.model.MovieEvent,
          paymentEvent:org.example.model.PaymentEvent,
          userEvent:org.example.model.UserEvent
    listener:
      missing-topics-fatal: false
      type: batch
      ack-mode: manual_immediate
    template:
      default-topic: movie-events

logging:
  level:
    root: INFO
    org.springframework.kafka: DEBUG
    org.example: DEBUG

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true